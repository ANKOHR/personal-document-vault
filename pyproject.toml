[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-document-vault"
version = "0.1.0"
description = "Deterministic local document metadata vault"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pdv = "personal_document_vault.cli:main"

[tool.setuptools.packages.find]
include = ["personal_document_vault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
